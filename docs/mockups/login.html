<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FashionHub</title>
    <link rel="stylesheet" href="design-system.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">FashionHub</a></div>
    </header>

    <main class="auth-container">
        <h2>Welcome Back</h2>
        <form>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
            </div>
            <button class="btn" style="width: 100%; border: none; cursor: pointer;">Sign In</button>
        </form>
        <div class="auth-toggle">
            Don't have an account? <a href="#">Create one</a>
        </div>
    </main>

    <footer style="margin-top: 4rem;">
        <div>
            <h3>FashionHub</h3>
            <p>Your destination for premium fashion and lifestyle.</p>
        </div>
        <div>
            <h3>Quick Links</h3>
            <ul>
                <li><a href="#">About Us</a></li>
                <li><a href="#">FAQ</a></li>
            </ul>
        </div>
    </footer>
</body>
</html>
